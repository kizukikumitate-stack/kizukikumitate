# スコアリング設定
scoring:
  # 需要スコア = 出現数 × 意図の重み。意図語が含まれるサジェストは重み付け
  intent_words:
    high: [失敗, 意味ない, 定着しない, 効果ない, やり方, 改善, 形骸化, 比較, 費用]   # 悩み・購買意図
    mid: [とは, 事例, メリット, デメリット]
  # 同じ語でも文脈が違う検索を落とす（例: ゲームの「1on1」＝1対1の対戦）。
  # レポートに雑音が混ざったら、ここに1語足すだけで次回から消える
  noise_words:
    - valorant
    - apex
    - ブロスタ
    - 第五人格
    - 第五
    - コンパス
    - スプラ
    - フォートナイト
    - ポケモン
    - デュエル
    - 2k26
    - 2k25
    - バスケ
    - サッカー
    - 格闘
    - 対戦
  # 資産マッチ 0件 かつ 需要スコア上位 → 「新サービス候補」として起案対象
  new_service_threshold: 5
