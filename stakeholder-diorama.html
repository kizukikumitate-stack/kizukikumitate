<title>４次元トンボのメガネ ― ステークホルダー・ジオラマ｜きづきくみたて工房（テスト公開）</title>
<meta name="description" content="ひとつのテーマを、みんなの視点から眺める道具。関係者を場に並べ、経済・環境・社会 × 短期・中期・長期のレンズで「誰が得して、誰が損するか」を可視化します。">

<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A3439; --sub:#5E6E6A; --border:#D8E2DD; --indigo:#34618E; --indigo-dark:#274A6E;
  --yamabuki:#F2B33D; --gain:#3E9B6E; --loss:#D4635B; --mixed:#E09C3A; --neutral:#93A29C;
  --bg:#F3F7F4;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  font-weight:500; line-height:1.7;
  word-break:keep-all; overflow-wrap:break-word;
  line-break:strict; hanging-punctuation:allow-end;
  padding:18px 14px 64px;
}
.wrap{max-width:1100px; margin:0 auto;}

/* ---- ヘッダー ---- */
.head-row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
h1{margin:0; font-size:1.5rem; font-weight:900; letter-spacing:.01em;}
.subtitle{
  font-size:.62em; font-weight:800; color:var(--indigo); margin-left:.5em;
  white-space:nowrap; letter-spacing:.02em;
}
/* タイトル＝はじめの画面にもどるボタン（見た目は見出しのまま） */
.title-home{
  border:0; background:none; padding:0; margin:0; cursor:pointer; text-align:left;
  font:inherit; color:inherit; letter-spacing:inherit;
}
.title-home:hover{color:var(--indigo-dark);}
.title-home:hover .subtitle{text-decoration:underline; text-underline-offset:3px;}
.title-home:focus-visible{outline:2px solid var(--indigo); outline-offset:3px; border-radius:6px;}
.tagline{font-size:.8rem; color:var(--sub);}
.badge-test{
  font-size:.72rem; font-weight:800; color:#8A6A1E;
  background:#F8F1DE; border:1.5px solid var(--yamabuki); border-radius:99px; padding:3px 12px;
}
.theme-input{
  width:100%; margin-top:10px; border:1.5px solid var(--border); border-radius:10px;
  padding:10px 14px; font-size:.95rem; font-weight:700; font-family:inherit; color:var(--ink); background:#FFF;
}
.note-lead{font-size:.78rem; color:var(--sub); margin:8px 0 0; line-height:1.9;}

/* ---- 共通パーツ ---- */
.card{background:#FFF; border:1.5px solid var(--border); border-radius:16px; padding:16px;}
.pill{
  border:1.5px solid var(--border); background:#FFF; color:var(--ink); border-radius:99px;
  padding:6px 14px; font-size:.8rem; font-weight:700; cursor:pointer; font-family:inherit; line-height:1.4;
}
.pill.on{background:var(--indigo); border-color:var(--indigo); color:#FFF;}
.sbtn{
  border:1.5px solid var(--border); background:#FFF; color:var(--ink); border-radius:10px;
  padding:6px 12px; font-size:.78rem; font-weight:700; cursor:pointer; font-family:inherit; line-height:1.5;
}
.sbtn.primary{background:var(--indigo); border-color:var(--indigo); color:#FFF;}
.sbtn.gain{background:var(--gain); border-color:var(--gain); color:#FFF;}
.sbtn.expand{background:#3E4E8E; border-color:#3E4E8E; color:#FFF;}
.sbtn.back{background:#EAF1F7; border-color:var(--indigo); color:var(--indigo-dark);}
.sbtn.back.armed{background:var(--yamabuki); border-color:var(--yamabuki); color:#5C4508;}
.sbtn.danger{color:var(--loss);}
.sbtn.danger.armed{background:var(--loss); border-color:var(--loss); color:#FFF;}
.sbtn[disabled]{opacity:.45; cursor:default;}
.txt{
  width:100%; border:1.5px solid var(--border); border-radius:10px; padding:8px 10px;
  font-size:.85rem; font-family:inherit; color:var(--ink); background:#FFF; resize:vertical;
}
textarea:focus, input:focus{outline:2px solid var(--indigo); outline-offset:1px;}
button:focus-visible{outline:2px solid var(--indigo); outline-offset:2px;}
.lbl{font-size:.75rem; font-weight:800; color:var(--sub); display:block;}

/* ---- AIで下ごしらえ ---- */
#aiSection{margin-bottom:14px;}
.sec-title{font-size:.88rem; font-weight:900; margin-bottom:8px;}
.sec-title span{font-size:.75rem; font-weight:500; color:var(--sub); margin-left:8px;}
.ai-row{display:flex; gap:8px; flex-wrap:wrap;}
.ai-row .txt{flex:1 1 260px; width:auto;}
.vc-label{font-size:.72rem; font-weight:800; color:var(--sub); margin-bottom:6px;}
.vc-flow{display:flex; gap:4px; flex-wrap:wrap; align-items:center;}
.vc-item{display:inline-flex; align-items:center; gap:4px;}
.vc-chip{
  background:#EAF1F7; border:1.5px solid var(--indigo); color:var(--indigo-dark);
  border-radius:8px; padding:5px 11px; font-size:.8rem; font-weight:800;
}
.vc-arrow{color:var(--indigo); font-weight:900;}
.vc-sup{
  background:#F5F2E8; border:1.5px solid var(--yamabuki); color:#8A6A1E;
  border-radius:99px; padding:3px 10px; font-size:.75rem; font-weight:700;
}
.err{color:var(--loss); font-size:.78rem; font-weight:700; margin-top:8px;}

/* ---- モード切替（みんなの視点／システム思考） ---- */
.mode-bar{
  display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px;
  background:#FFF; border:1.5px solid var(--border); border-radius:14px; padding:9px 14px;
}
.mode-note{font-size:.75rem; color:var(--sub); flex:1 1 14rem; min-width:0;}
.mode-note b{color:var(--indigo-dark);}
.pill.sys.on{background:#3E4E8E; border-color:#3E4E8E;}

/* ---- システム思考モード：輪（ループ）の一覧 ---- */
#loops:empty{display:none;}
.loops-card{
  background:#FFF; border:1.5px solid var(--border); border-radius:16px; padding:14px 16px; margin-top:12px;
}
.loops-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
.loops-title{font-size:.88rem; font-weight:900;}
.loops-count{font-size:.72rem; font-weight:800; color:var(--sub); background:#EDF2F0; border-radius:99px; padding:2px 10px;}
.loop{border-top:1.5px dashed var(--border); padding:10px 0 2px;}
.loop:first-of-type{border-top:0;}
.loop-tag{
  display:inline-block; font-size:.72rem; font-weight:900; color:#FFF;
  border-radius:99px; padding:2px 10px; margin-right:6px;
}
.loop-tag.r{background:#D4635B;}
.loop-tag.b{background:#3E9B6E;}
.loop-delay{font-size:.72rem; font-weight:800; color:#8A6A1E; background:#F8F1DE; border-radius:99px; padding:2px 9px;}
.loop-chain{font-size:.82rem; font-weight:700; margin:6px 0 2px; word-break:auto-phrase;}
.loop-read{font-size:.78rem; color:var(--sub); line-height:1.8;}
.loops-empty{font-size:.8rem; color:var(--sub); line-height:1.9;}
.sys-q{font-size:.78rem; color:var(--sub); line-height:1.9; border-top:1.5px dashed var(--border); margin-top:10px; padding-top:8px;}

/* ---- システム思考モード：影響の矢の editor ---- */
.link-sec{border-top:1.5px dashed var(--border); margin-top:12px; padding-top:10px;}
.link-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:6px 0;}
.link-row select{
  flex:1 1 9rem; min-width:0; border:1.5px solid var(--border); border-radius:10px;
  padding:6px 8px; font-size:.8rem; font-family:inherit; background:#FFF; color:var(--ink);
}
.link-check{display:inline-flex; align-items:center; gap:5px; font-size:.76rem; font-weight:700; color:var(--sub);}
.link-row #linkAdd{margin-left:auto;}
.link-list{margin-top:8px; display:flex; flex-direction:column; align-items:stretch; gap:6px;}
.link-item{
  display:flex; gap:6px; align-items:center; flex-wrap:wrap;
  background:#F7FAF8; border:1.5px solid var(--border); border-radius:10px; padding:6px 10px; font-size:.78rem; font-weight:700;
}
.link-item .grow{flex:1 1 6rem; min-width:0;}
.link-mark{font-weight:900;}
.link-mark.same{color:var(--gain);}
.link-mark.opposite{color:var(--loss);}
.link-del{
  border:0; background:none; color:var(--loss); font-size:.76rem; font-weight:800;
  cursor:pointer; font-family:inherit; padding:2px 4px;
}
.link-in{font-size:.76rem; color:var(--sub); line-height:1.8;}

/* ---- コントロール ---- */
.controls{display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-bottom:12px;}
.ctl-group{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.ctl-group[hidden]{display:none;}
.ctl-label{font-size:.75rem; font-weight:800; color:var(--sub);}
.ctl-right{margin-left:auto; display:flex; gap:6px;}
.legend{display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
.legend-item{display:inline-flex; align-items:center; gap:5px; font-size:.75rem; font-weight:700;}
.dot{width:12px; height:12px; border-radius:99px; display:inline-block;}

/* ---- シナリオ ---- */
#scenarioBar:empty{display:none;}
.scen{
  display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap;
  background:#FFF; border:1.5px solid var(--border); border-radius:14px; padding:10px 14px;
}
.scen-title{font-size:.8rem; font-weight:900;}
.scen-btn{
  border:2px solid var(--border); background:#FFF; color:var(--ink); border-radius:12px;
  padding:8px 18px; font-size:.88rem; font-weight:900; cursor:pointer; font-family:inherit;
}
.scen-btn.on{background:var(--indigo-dark); border-color:var(--indigo-dark); color:#FFF;}
.scen-note{font-size:.72rem; color:var(--sub);}

/* ---- 本体レイアウト ---- */
.main{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;}
.col-left{flex:1 1 520px; min-width:min(100%,320px);}
.col-right{flex:1 1 330px; min-width:min(100%,300px);}
.main.table-view .col-left{flex:1 1 100%;}
.main.table-view .col-right{flex:1 1 100%;}
.stage-field{border-radius:18px; overflow:hidden; box-shadow:0 6px 24px rgba(42,52,57,.12);}
.stage-empty{
  padding:40px 20px; text-align:center; color:var(--sub); background:#FFF;
  border-radius:14px; border:1.5px dashed var(--border); font-size:.85rem;
}
#actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
svg.field{width:100%; height:auto; display:block;}
svg.field .token{cursor:pointer;}

/* ---- 世界地図と拠点 ---- */
.stage-frame{border-radius:18px; overflow:hidden; box-shadow:0 6px 24px rgba(42,52,57,.12);}
svg.globe{width:100%; height:auto; display:block; touch-action:none; cursor:grab;}
svg.globe:active{cursor:grabbing;}
/* 「地球」スケールのフィールドも回せる（コマは通常のカーソルに戻す） */
svg.field.spin{touch-action:none; cursor:grab;}
svg.field.spin:active{cursor:grabbing;}
svg.field.spin .token{cursor:pointer;}
svg.globe .site{cursor:pointer;}
.role-row, .site-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
.site-name{font-size:.95rem; font-weight:900;}
.site-role{
  font-size:.68rem; font-weight:800; color:#FFF; border-radius:99px; padding:3px 10px; line-height:1.6;
}

/* ---- 進め方ガイド ---- */
.head-actions{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.guide-btn{
  border:1.5px solid var(--indigo); background:#EAF1F7; color:var(--indigo-dark);
  border-radius:99px; padding:4px 13px; font-size:.72rem; font-weight:800;
  cursor:pointer; font-family:inherit; line-height:1.6;
}
.modal-back{
  position:fixed; inset:0; background:rgba(42,52,57,.45); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal-box{
  background:#FFF; border-radius:18px; max-width:620px; width:100%; max-height:85vh;
  overflow-y:auto; padding:22px 24px; box-shadow:0 12px 40px rgba(0,0,0,.25);
  -webkit-overflow-scrolling:touch;
}
.modal-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px;}
.modal-head h2{margin:0; font-size:1.05rem; font-weight:900;}
.modal-close{
  border:none; background:transparent; font-size:1.25rem; cursor:pointer;
  color:var(--sub); font-family:inherit; line-height:1; padding:4px 6px;
}
.modal-lead{font-size:.78rem; color:var(--sub); margin:0 0 14px; line-height:1.9;}
.act{margin-bottom:12px;}
.act-t{font-size:.84rem; font-weight:900; color:var(--indigo-dark);}
.act-b{font-size:.78rem; line-height:1.9; color:var(--ink);}
.act-magic{border-top:1.5px dashed var(--border); padding-top:10px; margin-top:4px;}
.act-magic .act-t{color:var(--ink); margin-bottom:4px;}
.act-q{font-size:.78rem; line-height:2.1;}
.modal-note{font-size:.72rem; color:var(--sub); margin:10px 0 0; line-height:1.9;}
@media (max-width:640px){
  .modal-box{padding:18px 16px; max-height:88vh;}
}

/* ---- 一覧表 ---- */
.tables{display:flex; flex-direction:column; align-items:stretch; gap:20px;}
.tbl-card{background:#FFF; border:1.5px solid var(--border); border-radius:14px; overflow:hidden;}
.tbl-head{padding:10px 16px; font-weight:900; font-size:.92rem; background:#F2F7F4; border-bottom:1.5px solid var(--border);}
.tbl-scroll{overflow-x:auto;}
table{border-collapse:collapse; width:100%; min-width:560px;}
th{
  text-align:left; font-size:.78rem; color:var(--sub); padding:8px 12px;
  border-bottom:1.5px solid var(--border); background:#FAFCFB; font-weight:700;
}
td{
  vertical-align:top; padding:10px 12px; border-bottom:1px solid #EDF2EF; font-size:.8rem;
  word-break:auto-phrase; overflow-wrap:anywhere;
}
td.who{font-weight:800; white-space:nowrap;}
.cellbox{display:flex; flex-direction:column; align-items:flex-start; gap:4px;}
.cell-empty{color:#B7C2BD; font-size:.75rem;}
.vtag{
  align-self:flex-start; font-size:.68rem; font-weight:800; color:#FFF;
  border-radius:99px; padding:2px 8px; line-height:1.6;
}
.cell-line{font-size:.78rem; color:var(--ink);}
.plus{color:var(--gain); font-weight:800;}
.minus{color:var(--loss); font-weight:800;}

/* ---- 編集パネル ---- */
.panel-head{display:flex; gap:8px; align-items:center; margin-bottom:10px;}
.panel-emoji{font-size:1.6rem; line-height:1;}
.panel-name{font-size:1.02rem; font-weight:900;}
.emoji-row{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px;}
.emoji-btn{
  font-size:1.05rem; padding:2px 4px; border-radius:8px; cursor:pointer;
  border:2px solid transparent; background:transparent; line-height:1.4;
}
.emoji-btn.on{border-color:var(--indigo);}
.panel-sep{border-top:1.5px dashed var(--border); padding-top:12px; margin-top:2px;}
.panel-sep-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap;}
.panel-sep-row .t{font-size:.82rem; font-weight:900;}
.counter{font-size:.72rem; color:var(--sub);}
.mini-row{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:6px;}
.mini-row.gap-b{margin-bottom:12px;}
.pill.mini{padding:5px 10px; font-size:.78rem;}
.vbtn{
  border:2px solid var(--border); background:#FFF; border-radius:99px; padding:5px 13px;
  font-size:.78rem; font-weight:800; cursor:pointer; font-family:inherit;
}
.guide{
  background:#FFF; border:1.5px dashed var(--border); border-radius:16px;
  padding:24px; color:var(--sub); font-size:.85rem; line-height:1.95;
  word-break:auto-phrase;
}
.guide b{color:var(--ink);}
.guide-title{color:var(--ink); font-weight:900; margin-bottom:8px;}
.guide-step{display:flex; align-items:flex-start; gap:6px; margin-bottom:6px;}
.guide-step .no{flex:0 0 auto; font-weight:800; color:var(--indigo);}
.guide-note{margin-top:12px; padding-top:10px; border-top:1.5px dashed var(--border);}
.ro-sit{font-size:.82rem; color:var(--sub); line-height:1.8; margin-bottom:12px;}
.cell-line{word-break:auto-phrase;}

/* ---- トースト ---- */
#toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(16px);
  background:var(--indigo-dark); color:#FFF; font-size:.82rem; font-weight:700;
  border-radius:99px; padding:10px 22px; opacity:0; pointer-events:none;
  transition:opacity .25s ease, transform .25s ease; z-index:50; max-width:90vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---- フッター ---- */
.foot{
  max-width:1100px; margin:40px auto 0; padding-top:18px; border-top:1.5px solid var(--border);
  font-size:.74rem; color:var(--sub); line-height:2;
}
.foot a{color:var(--indigo); text-decoration:none;}
.foot a:hover{text-decoration:underline;}

/* ---- 下部のケース帯（常時表示・一周できる） ---- */
.case-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:rgba(255,255,255,.97); border-top:1.5px solid var(--border);
  box-shadow:0 -6px 20px rgba(42,52,57,.10);
  padding:8px 14px; padding-bottom:calc(8px + env(safe-area-inset-bottom));
}
.case-bar-inner{max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:7px;}
.case-bar-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
/* 左の見出し側が伸び縮みを引き受け、右のボタン群は動かさない */
.cb-info{display:flex; align-items:center; gap:8px; flex:1 1 auto; min-width:0;}
.cb-nav{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
.case-bar-title{font-size:.75rem; font-weight:900; color:var(--sub); white-space:nowrap;}
.case-bar-now{
  font-size:.78rem; font-weight:800; color:var(--indigo-dark);
  flex:0 0 auto; width:clamp(7rem, 26vw, 13rem);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.case-bar-count{
  font-size:.72rem; font-weight:800; color:var(--sub); white-space:nowrap;
  background:#EDF2F0; border-radius:99px; padding:2px 10px; flex:0 0 auto;
}
/* ラベルが「もう一度で戻る」に変わっても幅が動かないよう固定する */
.cb-nav .sbtn{flex:0 0 auto; text-align:center;}
.cb-nav .cb-home{min-width:9.8em;}
.cb-toggle{
  border:1.5px solid var(--border); background:#FFF; color:var(--sub);
  border-radius:99px; width:30px; height:26px; font-size:.7rem; font-weight:900;
  cursor:pointer; font-family:inherit; line-height:1; flex:0 0 auto;
}
/* 11ケースを折り返して全部見せる（横スクロールで隠さない） */
.case-bar-list{
  display:flex; flex-wrap:wrap; gap:6px; padding-bottom:2px;
  max-height:34vh; overflow-y:auto;
}
.case-bar-list::-webkit-scrollbar{width:6px;}
.case-bar-list::-webkit-scrollbar-thumb{background:#CBD8D2; border-radius:99px;}
.cb-chip{
  flex:0 0 auto; white-space:nowrap;
  border:1.5px solid var(--border); background:#FFF; color:var(--ink); border-radius:99px;
  padding:5px 12px; font-size:.76rem; font-weight:700; cursor:pointer; font-family:inherit; line-height:1.4;
}

const uid = () => "s" + Math.random().toString(36).slice(2, 9);

function getCell(data, sid, axis, horizon) {
  return (data[sid] && data[sid][axis] && data[sid][axis][horizon]) || { merit: "", demerit: "", verdict: "" };
}

function aggregateVerdict(data, sid, axisIds, horizonIds) {
  let hasGain = false, hasLoss = false, hasAny = false;
  for (const a of axisIds) {
    for (const h of horizonIds) {
      const v = getCell(data, sid, a, h).verdict;
      if (!v) continue;
      hasAny = true;
      if (v === "gain") hasGain = true;
      else if (v === "loss") hasLoss = true;
      else if (v === "mixed") { hasGain = true; hasLoss = true; }
    }
  }
  if (hasGain && hasLoss) return "mixed";
  if (hasGain) return "gain";
  if (hasLoss) return "loss";

function projectPoint(lat, lon, lam0, phi0, R, cx, cy) {
  const f = Math.PI / 180;
  const p = lat * f, l = lon * f, l0 = lam0 * f, p0 = phi0 * f;
  const cosc = Math.sin(p0) * Math.sin(p) + Math.cos(p0) * Math.cos(p) * Math.cos(l - l0);
  const x = Math.cos(p) * Math.sin(l - l0);
  const y = Math.cos(p0) * Math.sin(p) - Math.sin(p0) * Math.cos(p) * Math.cos(l - l0);
  return { x: cx + R * x, y: cy - R * y, visible: cosc > 0, depth: cosc };
}

/* 「地球」スケールで使う地球儀の中身（拠点ピンなし・S.rot に追従する）。
   世界地図（globeInner）と同じ投影・同じ大陸データを使うので、回した向きは両方で共有される。 */
function spinGlobeParts(cx, cy, R) {
  cx = cx == null ? 400 : cx; cy = cy == null ? 345 : cy; R = R == null ? 185 : R;
  let out = '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="#4A7FB5"/>';
  CONTINENTS.forEach((pts) => {
    const vis = pts.map((c) => projectPoint(c[0], c[1], S.rot.lam, S.rot.phi, R, cx, cy)).filter((p) => p.visible);
    if (vis.length < 3) return;
    out += '<polygon points="' + vis.map((p) => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ") +
      '" fill="#79B06A" stroke="#5E8F52" stroke-width="1"/>';
  });
  return out + '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="url(#earthShade)"/>';
}

function aggregateSiteVerdict(sids, axes, hs) {
  let hasGain = false, hasLoss = false, hasAny = false;
  for (const sid of sids) {
    for (const a of axes) for (const h of hs) {
      const v = getCell(S.data, sid, a, h).verdict;
      if (!v) continue;
      hasAny = true;
      if (v === "gain") hasGain = true;
      else if (v === "loss") hasLoss = true;
      else if (v === "mixed") { hasGain = true; hasLoss = true; }
    }
  }
  if (hasGain && hasLoss) return "mixed";
  if (hasGain) return "gain";
  if (hasLoss) return "loss";
  return hasAny ? "neutral" : "";
}

  S.links = S.links.filter((l) => ids.indexOf(l.from) >= 0 && ids.indexOf(l.to) >= 0);
}

/* 閉じた輪（ループ）を探す。逆向きの矢が偶数なら強化ループ(R)、奇数なら平衡ループ(B)。 */
function findLoops() {
  const adj = {};
  S.links.forEach((l) => { (adj[l.from] = adj[l.from] || []).push(l); });
  const found = [], seen = {};
  const record = (nodes, links) => {
    /* いちばん小さいIDに回して重複を除く */
    let min = 0;
    for (let i = 1; i < nodes.length; i++) if (nodes[i] < nodes[min]) min = i;
    const rot = nodes.slice(min).concat(nodes.slice(0, min));
    const key = rot.join(">");
    if (seen[key]) return;
    seen[key] = true;
    const opp = links.filter((l) => l.kind === "opposite").length;
    found.push({
      nodes: nodes, links: links,
      kind: opp % 2 === 0 ? "r" : "b",
      hasDelay: links.some((l) => l.delay),
    });
  };
  const walk = (start, node, nodes, links) => {
    if (found.length > 24) return; /* 探しすぎない */
    (adj[node] || []).forEach((l) => {
      if (l.to === start) { record(nodes, links.concat(l)); return; }
      if (nodes.indexOf(l.to) >= 0) return;
      if (nodes.length >= 6) return; /* 長すぎる輪は追わない */
      walk(start, l.to, nodes.concat(l.to), links.concat(l));
    });
  };
  S.stakeholders.forEach((s) => walk(s.id, s.id, [s.id], []));
  return found;
}

function loopChain(loop) {
  return loop.nodes.map((id, i) => {
    const l = loop.links[i];
    const m = LINK_KINDS[l.kind].mark + (l.delay ? "⏳" : "");
    return stakeholderName(id) + " —" + m + "→ ";
  }).join("") + stakeholderName(loop.nodes[0]);
}

function renderLoops() {
  const box = $("loops");
  if (S.mode !== "systems") { box.innerHTML = ""; return; }
  const loops = findLoops();

    '<button type="button" class="sbtn" data-sys="guide" style="margin-left:auto">📖 システム思考の使い方</button></div>';
  if (!S.links.length) {

  } else if (!loops.length) {

  } else {

        (lp.hasDelay ? '<span class="loop-delay">⏳ 遅れあり</span>' : "") +

        '<div class="loop-read">' +

/* 盤面に矢を描く（コマの下に敷く） */
function linkMarkup(list, positions) {
  const idx = {};
  list.forEach((s, i) => { idx[s.id] = positions[i]; });
  const shown = S.links.filter((l) => idx[l.from] && idx[l.to]);
  if (!shown.length) return "";
  let out = '<g class="links">';
  shown.forEach((l) => {
    const a = { x: idx[l.from].x, y: idx[l.from].y - 26 };
    const b = { x: idx[l.to].x, y: idx[l.to].y - 26 };
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const ax = a.x + ux * 26, ay = a.y + uy * 26;
    const bx = b.x - ux * 30, by = b.y - uy * 30;
    /* 往復の矢が重ならないよう、進行方向の左へふくらませる */
    const bow = 30;
    const qx = (ax + bx) / 2 - uy * bow, qy = (ay + by) / 2 + ux * bow;
    const k = LINK_KINDS[l.kind];
    out += '<path d="M' + ax.toFixed(1) + "," + ay.toFixed(1) + " Q" + qx.toFixed(1) + "," + qy.toFixed(1) +
      " " + bx.toFixed(1) + "," + by.toFixed(1) + '" fill="none" stroke="' + k.color +
      '" stroke-width="3" opacity="0.85"' + (l.kind === "opposite" ? ' stroke-dasharray="8 5"' : "") +
      ' marker-end="url(#arrow-' + l.kind + ')"/>';
    /* 真ん中に符号（＋／−）と遅れの砂時計 */
    const mx = (ax + 2 * qx + bx) / 4, my = (ay + 2 * qy + by) / 4;
    out += '<g transform="translate(' + mx.toFixed(1) + "," + my.toFixed(1) + ')">' +
      '<circle r="11" fill="#FFFFFF" stroke="' + k.color + '" stroke-width="2"/>' +
      '<text y="4.5" text-anchor="middle" font-size="12" font-weight="900" fill="' + k.color + '">' + k.mark + "</text>" +
      (l.delay ? '<text x="0" y="-14" text-anchor="middle" font-size="11">⏳</text>' : "") + "</g>";
  });
  return out + "</g>";
}

function tokenPositions(n) {
  const cx = 400, cy = 350, rx = 265, ry = 128, pts = [];
  for (let i = 0; i < n; i++) {

    pts.push({ x: cx + rx * Math.cos(ang), y: cy + ry * Math.sin(ang) });
  }
  return pts;
}

/* ================= 描画 ================= */
/* ---- 地球儀：ドラッグで回す ---- */
function bindGlobeDrag(svg) {
  let drag = null, moved = 0;
  const movedFn = () => moved;
  const onMove = (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag = { x: e.clientX, y: e.clientY };
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved < 4) return; /* 指のわずかな震えでは回さない */
    /* 縦横どちらも「引っ張る」向き。lam を引くと地球が指の向きについてくる */
    S.rot = { lam: S.rot.lam - dx * 0.5, phi: Math.max(-60, Math.min(60, S.rot.phi + dy * 0.4)) };
    svg.innerHTML = globeInner();
    bindSiteClicks(svg, movedFn);
    e.preventDefault();
  };
  const onEnd = () => {
    drag = null;
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onEnd);
    window.removeEventListener("pointercancel", onEnd);
    setTimeout(() => { moved = 0; }, 0); /* クリック判定のあとで戻す */
  };
  svg.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY }; moved = 0;
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onEnd);
    window.addEventListener("pointercancel", onEnd);
  });
  bindSiteClicks(svg, movedFn);
}
/* 「地球」スケールのフィールドを回す。地球の絵だけ差し替えるのでコマは動かない */
function bindEarthSpin(svg) {
  const g = svg.querySelector("#spinGlobe");
  if (!g) return;
  svg.classList.add("spin");
  let drag = null;
  const onMove = (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag = { x: e.clientX, y: e.clientY };
    svg._spinMoved = (svg._spinMoved || 0) + Math.abs(dx) + Math.abs(dy);
    if (svg._spinMoved < 4) return; /* 指のわずかな震えでは回さない */
    S.rot = { lam: S.rot.lam - dx * 0.5, phi: Math.max(-60, Math.min(60, S.rot.phi + dy * 0.4)) };
    g.innerHTML = spinGlobeParts();
    e.preventDefault();
  };
  const onEnd = () => {
    drag = null;
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onEnd);
    window.removeEventListener("pointercancel", onEnd);
    save();
    setTimeout(() => { svg._spinMoved = 0; }, 0); /* クリック判定のあとで戻す */
  };
  svg.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY }; svg._spinMoved = 0;
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onEnd);
    window.addEventListener("pointercancel", onEnd);
  });
}
function bindSiteClicks(svg, movedFn) {
  svg.querySelectorAll(".site").forEach((g) => {
    g.style.cursor = "pointer";
    g.addEventListener("click", (e) => {
      e.stopPropagation();
      if (movedFn && movedFn() > 8) return; /* 回しただけの指を誤爆させない */
      openSite(g.getAttribute("data-site"));
    });
  });
}

function renderStage() {
  const stage = $("stage");
  document.querySelector(".main").classList.toggle("table-view", S.view === "table");
  if (S.view === "field" && S.world && !S.currentSiteId && S.scale === "earth") {
    /* 世界地図：拠点を選ぶ（スケール「地球」のとき。会議室・街を選ぶと下の通常の盤面になる） */
    stage.className = "";

      ROLE_FILTERS.map((r) => '<button type="button" class="pill' + (S.roleFilter === r.id ? " on" : "") +
        '" data-role="' + r.id + '">' + esc(r.label) + "</button>").join("") + "</div>" +
      '<div class="stage-frame">' + globeMarkup() + "</div>";
    stage.querySelectorAll("[data-role]").forEach((b) => b.addEventListener("click", () => {
      S.roleFilter = b.getAttribute("data-role"); renderStage(); save();
    }));
    const svg = stage.querySelector("svg.globe");
    if (svg) bindGlobeDrag(svg);
  } else if (S.view === "field" && S.world && S.currentSiteId) {

/* いまの盤面が手で編集されているか（＝上書きすると失われるか） */
function boardIsDirty() {
  if (!S.stakeholders.length) return false;
  if (!S.caseId) return true;
  const p = pristinePayload(S.caseId);
  if (!p) return true;
  const cur = payload();
  if ((cur.theme || "") !== (p.theme || "")) return true;
  if (JSON.stringify(cur.stakeholders) !== JSON.stringify(p.stakeholders)) return true;
  /* 引いた矢は盤面の中身なので、消えると困る＝編集ありと見なす */
  if ((cur.links || []).length !== (p.links || []).length) return true;
  if (cur.scenario && p.scenario) {
    /* どのシナリオを開いているかは編集ではないので、中身どうしを比べる */
    return JSON.stringify(cur.scenario.store) !== JSON.stringify(p.scenario.store);
  }
  return JSON.stringify(cur.data) !== JSON.stringify(p.data);
}
function setMode(id) {
  const m = MODES.find((x) => x.id === id);
  if (!m || S.mode === id) return;
  S.mode = id;
  renderControls(); renderStage(); renderActions(); renderPanel(); renderLoops(); save();
  if (id === "systems") {
    toast(S.links.length ? "システム思考モード：矢と輪を表示しています"
                         : "システム思考モード：コマを選んで「影響の矢」を引くと、輪を自動で見つけます");
  } else {
    toast("みんなの視点モードにもどりました（引いた矢は消えていません）");
  }
}
function tryLoadCase(id) {
  if (!CASES[id]) return;
  if (id === S.caseId && !boardIsDirty()) return;
  if (boardIsDirty() && pendingCase !== id) {
    pendingCase = id;
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => { pendingCase = null; renderCaseBar(); }, 4000);
    renderCaseBar();
    toast("いまの盤面は書きかわります。もう一度押すと切り替えます");
    return;
  }
  pendingCase = null; clearTimeout(pendingTimer);
  loadCase(id);
}
function stepCase(d) {
  const n = CASE_MENU.length;
  const i = caseIndex();
  const next = i < 0 ? (d > 0 ? 0 : n - 1) : (i + d + n) % n;
  tryLoadCase(CASE_MENU[next].id);
}

/* ================= 操作 ================= */
function addStakeholder() {
  const s = { id: uid(), name: "関係者" + (S.stakeholders.length + 1), emoji: EMOJIS[S.stakeholders.length % EMOJIS.length], situation: "" };
  if (S.world) s.siteId = S.currentSiteId || homeSiteId();
  S.stakeholders.push(s);
  S.selectedId = s.id;
  renderStage(); renderActions(); renderPanel(); save();
}
function updateStakeholder(id, patch) {
  S.stakeholders = S.stakeholders.map((s) => (s.id === id ? Object.assign({}, s, patch) : s));
}
function removeStakeholder(id) {
  S.stakeholders = S.stakeholders.filter((s) => s.id !== id);
  delete S.data[id];
  if (S.selectedId === id) S.selectedId = null;
  pruneLinks(); /* いなくなった人につながる矢も片付ける */
  renderStage(); renderActions(); renderPanel(); renderLoops(); save();
}
function updateCell(sid, axis, horizon, patch) {
  const cur = getCell(S.data, sid, axis, horizon);
  if (!S.data[sid]) S.data[sid] = {};

function b64encode(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64decode(str) {
  const s = str.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s + "===".slice((s.length + 3) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function pristinePayload(id) {
  const c = CASES[id];
  if (!c) return null;
  const p = { theme: c.theme, scale: c.scale, stakeholders: clone(c.stakeholders), data: {},
    business: "", valueChain: c.valueChain ? clone(c.valueChain) : null, themeIdeas: [], scenario: null, caseId: id,
    mode: S.mode, /* モードは見方の切替であって盤面の中身ではない */ links: c.links ? clone(c.links) : [] };
  if (c.scenarios) {
    const first = c.scenarios.options[0].id;
    const store = clone(c.scenarios.data);
    p.scenario = { options: clone(c.scenarios.options), active: first, store: store };
    p.data = clone(store[first] || {});
  } else {
    p.data = clone(c.data || {});
  }
  return p;
}
async function encodeState() {
  const cur = payload();
  if (S.caseId && S.mode === "views") {
    const pristine = pristinePayload(S.caseId);
    if (pristine && JSON.stringify(cur) === JSON.stringify(pristine)) return "c" + S.caseId;
  }
  const bytes = new TextEncoder().encode(JSON.stringify(cur));
  if (typeof CompressionStream === "function") {
    try {
      const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      const buf = await new Response(stream).arrayBuffer();
      return "z" + b64encode(new Uint8Array(buf));
    } catch (e) { /* 非対応ブラウザは無圧縮へ */ }
  }
  return "r" + b64encode(bytes);
}
async function decodeState(token) {
  if (!token) return null;
  const kind = token[0], rest = token.slice(1);
  if (kind === "c") return pristinePayload(rest);
  const bytes = b64decode(rest);
  if (kind === "r") return JSON.parse(new TextDecoder().decode(bytes));
  if (kind === "z" && typeof DecompressionStream === "function") {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const buf = await new Response(stream).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  return null;
}
async function shareUrl() {
  try {
    const token = await encodeState();
    const url = location.origin + location.pathname + "#s=" + token;
    history.replaceState(null, "", "#s=" + token);

    }

  $("titleHome").addEventListener("click", goHome);
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("guideModal").hidden) { closeGuide(); return; }
    /* 拠点のなかにいるときは Esc で地球にもどる（盤面は消さない） */
    if (S.currentSiteId) backToGlobe();
  });

  window.addEventListener("resize", syncBarSpace);

  renderAll();
  syncBarSpace();
  if (restored) toast("共有された盤面を開きました");
})();

</script>
</body>
</html>
